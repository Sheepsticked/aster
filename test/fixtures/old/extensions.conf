[globals]

[general]
autofallthrough=yes

[default]
exten => _5XX,1,Dial(SIP/${EXTEN})
exten => _5XX,n,Hangup()

[phones]
exten => s,1,Dial(SIP/504&SIP/505&SIP/506&SIP/507&SIP/508,120,m)
exten => s,n,System(/usr/bin/sendEmail -f null@null.com -t 111222333@telegram.user -o message-charset=UTF-8 -o tls=no -u "Missed call on `/bin/hostname -s` ${DONGLENAME} from ${CALLERID(num)}" -m " " -s 127.0.0.1:2525 -xu null@null.com -xp null)
exten => s,n,Hangup()
exten => sms,1,Verbose(Incoming SMS from ${CALLERID(num)} (base64 len ${LEN(${SMS_BASE64})}))
exten => sms,n,Set(SMSFILE=/var/lib/asterisk/last-sms-gsm1.txt)
exten => sms,n,System(/usr/bin/printf "%s - " "${STRFTIME(${EPOCH},,%d-%m-%Y %H:%M:%S)}" > ${SMSFILE})
exten => sms,n,System(/usr/bin/printf "%s" "${SMS_BASE64}" | /usr/bin/base64 -d >> ${SMSFILE})
exten => sms,n,System(/bin/echo >> ${SMSFILE})
exten => sms,n,System(/bin/cat ${SMSFILE} >> /var/lib/asterisk/sms_GSM.txt)
; TODO DONGLENAME make universal for quectel also
exten => sms,n,System(/usr/bin/sendEmail -f null@null.com -t 111222333@telegram.user -o message-charset=UTF-8 -o tls=no -u "SMS to `/bin/hostname -s` ${DONGLENAME} from ${CALLERID(num)}" -o message-file=${SMSFILE} -s 127.0.0.1:2525 -xu null@null.com -xp null)
exten => sms,n,Hangup()
exten => +375290000010,1,Dial(SIP/504&SIP/505&SIP/506&SIP/507&SIP/508,120,m)
exten => +375290000010,n,Hangup()
exten => _5XX,1,Dial(SIP/${EXTEN})
exten => _5XX,n,Hangup()
exten => _+.,1,Dial(Dongle/r1/${EXTEN}&Quectel/r1/${EXTEN})
exten => _+.,n,Hangup()
exten => _*X.,1,Dial(Dongle/r1/${EXTEN:1}&Quectel/r1/${EXTEN:1})
exten => _*X.,n,Hangup()

