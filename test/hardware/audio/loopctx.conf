[audiotest-loop]                 ; the SIP app's own leg, no modem (Gosub from 900/901 in [internal]): reference, then the
                                 ; caller's voice recorded and played back; ARG1 = jitter buffer kind or none
exten => s,1,Set(CHANNEL(hangup_handler_push)=audiotest-rtcp,s,1)
 same => n,ExecIf($["${ARG1}"!="none"]?Set(JITTERBUFFER(${ARG1})=default))
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/var/spool/aster/audiotest/ref)
 same => n,Playback(/usr/share/asterisk/sounds/ru/demo-thanks)
 same => n,Set(REC=/var/spool/aster/audiotest/sip-${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Record(${REC}.wav,3,20,k)
 same => n,Wait(1)
 same => n,Playback(${REC})
 same => n,Wait(1)
 same => n,Hangup()
[audiotest-rtcp]                 ; what the RTP leg looked like, at hangup
exten => s,1,Log(NOTICE,audiotest ${CHANNEL(name)} codec ${CHANNEL(audionativeformat)} rtcp ${CHANNEL(rtcp,all)})
 same => n,Return()
