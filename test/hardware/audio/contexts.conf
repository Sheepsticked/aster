; Call audio check — hand-owned test contexts, added to extensions.conf for the test only.
[audiotest-play]                 ; the called modem (its incoming_context for the test): answer, play the reference, then speech
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(/var/spool/aster/audiotest/ref)
 same => n,Playback(/usr/share/asterisk/sounds/ru/demo-thanks)
 same => n,Wait(1)
 same => n,Hangup()
[audiotest-record]               ; the calling modem (originate ... extension <tag>@audiotest-record): record what arrives
exten => _[a-z].,1,Record(/var/spool/aster/audiotest/rec-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav,0,50,kq)
 same => n,Hangup()
