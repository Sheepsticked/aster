[audiotest-phone]                ; the user's phone calls this modem: reference, then their voice is recorded and played back
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(/var/spool/aster/audiotest/ref)
 same => n,Playback(/usr/share/asterisk/sounds/ru/demo-thanks)
 same => n,Set(REC=/var/spool/aster/audiotest/phone-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Record(${REC}.wav,3,20,k)
 same => n,Wait(1)
 same => n,Playback(${REC})
 same => n,Wait(1)
 same => n,Hangup()
