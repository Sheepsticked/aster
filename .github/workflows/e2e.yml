# Brings the whole stack up on one runner from the production compose file with a test overlay, then drives it through
# AMI and a browser: calls, SMS, notifications, a driver reload, a rejected configuration, and the idle write budget.
# test/e2e/run.sh is the job; this file only gives it a runner and keeps what it wrote.
name: e2e
on:
  push:
    paths: ['test/e2e/**', 'docker-compose.yml', 'docker/**', 'packages/**', 'tools/write-budget.sh',
      '.github/workflows/e2e.yml']
  pull_request:
    paths: ['test/e2e/**', 'docker-compose.yml', 'docker/**', 'packages/**', 'tools/write-budget.sh',
      '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: the whole stack, through AMI and the browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTER_E2E_HOME: ${{ github.workspace }}/../aster-e2e-home
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0   # the image's Node: the flows use the controller's AMI client and node:sqlite

      - run: npm ci

      # Chromium only: the two projects of packages/ui/playwright.config.js are a phone and a desktop, both Chromium.
      - run: npx playwright install --with-deps chromium

      - name: shellcheck the runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning test/e2e/run.sh

      - name: build the two images, bring the stack up, run the flows, the browser and the write budget
        run: test/e2e/run.sh --budget-seconds 60

      - name: Keep the screenshots, the traces and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            test/e2e/test-results
            test/e2e/logs
          if-no-files-found: warn
