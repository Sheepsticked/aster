; Aster — built-in defaults (see asterisk.conf): [general] and [defaults] only, no devices. In production the
; device sections are generated into aster.d/dongle-devices.conf from the registry.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-dongle     ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
autodeletesms = yes             ; a SIM store that fills up makes the modem refuse new messages (the controller already has them)
