; Aster — built-in defaults (see asterisk.conf): transport + the endpoint/auth/aor templates the generated
; aster.d/phones.conf sections inherit from. No endpoints here: without an anonymous endpoint
; identifier every unauthenticated INVITE is rejected. Production appends `#include aster.d/phones.conf`.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[aster-phone](!)
type = endpoint
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
language = ru
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = yes

[aster-auth](!)
type = auth
auth_type = userpass

[aster-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
