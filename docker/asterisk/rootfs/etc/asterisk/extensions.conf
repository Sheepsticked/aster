; Aster — built-in defaults (see asterisk.conf): the hand-owned starter dialplan shape without
; the generated includes. Production adds `#include aster.d/globals.conf` inside [globals] and
; `#include aster.d/modems.conf` as the last line; the controller writes those files from the registry.
[general]
static = yes
writeprotect = no
autofallthrough = yes
clearglobalvars = no

[globals]

[internal]
exten => _5XX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()
