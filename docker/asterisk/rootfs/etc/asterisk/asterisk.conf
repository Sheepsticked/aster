; Aster — built-in Asterisk defaults. Used only when nothing is mounted on /etc/asterisk (bare `docker run`, CI
; checks). Production bind-mounts the home's config/asterisk here (starter files from install/templates), which
; hides these files completely. Keep this file in step with the starter asterisk.conf.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
execincludes = no          ; #exec in config files is never allowed (the controller's lint rejects it as well)
hideconnect = yes          ; keep `asterisk -rx` healthchecks out of the log
transmit_silence = no
nocolor = yes              ; plain text in `docker logs`
timestamp = yes            ; timestamps on verbose lines
