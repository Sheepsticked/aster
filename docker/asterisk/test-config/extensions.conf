; Aster — test-config (see asterisk.conf): the hand-owned starter extensions.conf plus two
; custom contexts: [smoke-in], named by docker/asterisk/test-registry.yaml, and the smoke-test helpers [smoke]. The
; generated half is aster.d/globals.conf and aster.d/modems.conf (generator output for test-registry.yaml).
[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]
#include aster.d/globals.conf        ; GSM1=Quectel/gsm1 ... maintained by Aster
PHONE_JITTERBUFFER=adaptive          ; as in the starter extensions.conf: the generated dialplan reads it

[internal]
exten => _5XX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

; Put custom contexts here and reference them from the UI
; (modem "incoming context" or phone "context" override).

; The incoming_context of modem gsm_uac and the context of phone 597 in test-registry.yaml.
[smoke-in]
exten => s,1,Hangup()

; Smoke-test helpers (smoke-test.sh originates Local/<exten>@smoke): each sets the channel variables a driver or a phone
; sets and enters a generated context; the hostile caller id and SMS sender must reach the spool only as base64.
[smoke]
exten => call,1,Set(CALLERID(num)=`id`\;$(id))
 same => n,Goto(aster-in-gsm_test,s,1)
exten => did,1,Set(CALLERID(num)=+375290000001)
 same => n,Goto(aster-in-gsm_test,+1234567890,1)
exten => sms,1,Set(CALLERID(num)="\;touch /tmp/aster-smoke-pwned\;")
 same => n,Set(SMS_BASE64=${BASE64_ENCODE(Привет из smoke-теста)})
 same => n,Set(SMS_TS=2026-09-10 09:30:00 +0300)
 same => n,Goto(aster-in-gsm_test,sms,1)
exten => report,1,Set(CALLERID(num)=+375290000002)
 same => n,Set(SMS_REPORT_PAYLOAD=42:1)
 same => n,Set(SMS_REPORT_TYPE=e)
 same => n,Set(SMS_REPORT_SUCCESS=1)
 same => n,Set(SMS_REPORT_TS=2026-09-10 09:30:05 +0300)
 same => n,Set(SMS_REPORT_DT=2026-09-10 09:30:07 +0300)
 same => n,Set(SMS_REPORT=+CDS: 6)
 same => n,Goto(aster-in-gsm_test,report,1)
exten => sms-bad,1,Set(CALLERID(num)=+375290000003)
 same => n,Set(SMS_BASE64=not base64!)
 same => n,Goto(aster-in-gsm_test,sms,1)
exten => out,1,Set(CALLERID(num)=599)
 same => n,Goto(aster-phones-gsm_test,+1234567890,1)
exten => in-out,1,Set(__ASTER_MODEM=gsm_test)
 same => n,Set(CHANNEL(hangup_handler_push)=aster-hangup,s,1)
 same => n,Goto(aster-out-gsm_test,*1234567891,1)
exten => jb,1,Gosub(aster-jitterbuffer,s,1)
 same => n,Log(NOTICE,smoke jb: the handler set JITTERBUFFER(${PHONE_JITTERBUFFER}) and returned)
 same => n,Hangup()

#include aster.d/modems.conf
