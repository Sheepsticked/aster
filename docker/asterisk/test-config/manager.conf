; Aster — test-config (see asterisk.conf): AMI user aster/test for the smoke test and the later integration tests
; only. The installed manager.conf is generated by install.sh with a generated
; secret and bindaddr 127.0.0.1 on the host network. A test container has its own network namespace, so AMI listens
; on all of the container's interfaces: reachable through `docker exec` or an explicitly published port only.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

[aster]
secret = test
read = system,call,command,reporting,user
write = system,call,command,reporting,originate
