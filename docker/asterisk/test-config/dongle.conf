; Aster — test-config (see asterisk.conf): the hand-owned starter shape — [general] and [defaults] only; the device
; section comes from the generated include.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-dongle     ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
autodeletesms = yes             ; a SIM store that fills up makes the modem refuse new messages (the controller already has them)

#include aster.d/dongle-devices.conf
