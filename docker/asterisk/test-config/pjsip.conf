; Aster — test-config (see asterisk.conf): the hand-owned starter pjsip.conf shape — transport and the templates the
; generated endpoints inherit from; endpoints 597–599 come from aster.d/phones.conf. No anonymous
; endpoint identifier, so every unauthenticated INVITE is rejected.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[aster-phone](!)
type = endpoint
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
language = ru
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = yes

[aster-auth](!)
type = auth
auth_type = userpass

[aster-aor](!)
type = aor
max_contacts = 2
remove_existing = yes

#include aster.d/phones.conf
