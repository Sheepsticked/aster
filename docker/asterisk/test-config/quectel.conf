; Aster — test-config (see asterisk.conf): the hand-owned starter shape — [general] and [defaults] only; the device
; section comes from the generated include.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-quectel    ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
autodeletesms = yes             ; a SIM store that fills up makes the modem refuse new messages (the controller already has them)
qrxgain = 8192                  ; EC25: the modem's own downlink digital gain (AT+QRXGAIN, 0..65535), sent at every connect because a reset
                                ; forgets it; the default 20577 clips a caller of normal loudness. Remove the line to send nothing.

#include aster.d/quectel-devices.conf
