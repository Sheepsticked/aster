; Aster — test-config: container-only Asterisk configuration, mounted read-only on /etc/asterisk by
; docker/asterisk/smoke-test.sh and by later container tests (AtCommand, generated files, AMI, apply,
; outbox). Never installed. The layout mirrors production: hand-owned starter files here, the generated half in
; aster.d/ (the controller's generator output for docker/asterisk/test-registry.yaml, which
; packages/controller/test/generators.test.js keeps equal to it). Files without test-specific content are copies of the
; built-in defaults (docker/asterisk/rootfs/etc/asterisk).
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
execincludes = no          ; #exec in config files is never allowed (the controller's lint rejects it as well)
hideconnect = yes          ; keep `asterisk -rx` healthchecks out of the log
transmit_silence = no
nocolor = yes              ; plain text in `docker logs`
timestamp = yes            ; timestamps on verbose lines
