; Aster — test-config copy of the built-in default (see asterisk.conf). Same shape as the hand-owned starter file.
; The image only contains the modules Aster needs (docker/asterisk/menuselect.opts), so no noload lines are required.
[modules]
autoload = yes
require => chan_pjsip.so
require => chan_quectel.so
require => chan_dongle.so
require => res_musiconhold.so
require => pbx_config.so
require => app_dial.so
require => app_system.so
require => app_stack.so
require => func_base64.so
