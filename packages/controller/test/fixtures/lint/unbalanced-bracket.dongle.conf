; Lint fixture: the hand-owned starter dongle.conf with one problem — the [defaults header lacks its ], so
; Asterisk rejects the file and chan_dongle then crashes Asterisk (SIGSEGV), at boot and on reload.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-dongle     ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults
initstate = stop

#include aster.d/dongle-devices.conf
