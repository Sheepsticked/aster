; Lint fixture: the hand-owned starter pjsip.conf with one problem — [aster-aor](!) was deleted, so every
; generated [<number>](aster-aor) section would name a missing template and Asterisk would reject the file.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[aster-phone](!)
type = endpoint
disallow = all
allow = ulaw,alaw,gsm
dtmf_mode = rfc4733
language = ru
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = yes

[aster-auth](!)
type = auth
auth_type = userpass

#include aster.d/phones.conf
