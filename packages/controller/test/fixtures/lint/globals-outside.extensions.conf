; Lint fixture: the starter extensions.conf with one problem — the include of the generated
; globals sits in [internal], where Asterisk would read GSM1=Quectel/gsm1 as an unknown dialplan line, not as a global.
[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]

[internal]
#include aster.d/globals.conf
exten => _5XX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

#include aster.d/modems.conf
