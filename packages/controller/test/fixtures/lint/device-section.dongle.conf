; Lint fixture: the hand-owned starter dongle.conf with one problem — a hand-written device section. Modems are
; configured in aster.yaml, which generates aster.d/dongle-devices.conf.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-dongle     ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop

#include aster.d/dongle-devices.conf

[gsm3]
context = aster-in-gsm3
imei = 490154203237543
initstate = start
