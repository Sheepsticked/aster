; Lint fixture: the hand-owned starter pjsip.conf with one problem — [office-trunk] has no type line, so
; res_pjsip would silently ignore it.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[aster-phone](!)
type = endpoint
disallow = all
allow = ulaw,alaw,gsm
dtmf_mode = rfc4733
language = ru
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = yes

[aster-auth](!)
type = auth
auth_type = userpass

[aster-aor](!)
type = aor
max_contacts = 2
remove_existing = yes

[office-trunk]
contact = sip:192.168.10.1:5060

#include aster.d/phones.conf
