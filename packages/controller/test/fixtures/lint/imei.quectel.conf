; Lint fixture: the hand-owned starter quectel.conf with one problem — an imei line in [defaults]. Modems and
; their IMEIs are configured in aster.yaml, which generates aster.d/quectel-devices.conf.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-quectel    ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
imei = 490154203237534

#include aster.d/quectel-devices.conf
