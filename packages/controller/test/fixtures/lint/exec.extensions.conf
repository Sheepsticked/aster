; Lint fixture: the starter extensions.conf with one problem — line 18 runs a program with
; #exec, which Aster never allows (asterisk.conf sets execincludes = no as well).
[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]
#include aster.d/globals.conf        ; GSM1=Quectel/gsm1 ... maintained by Aster

[internal]
exten => _5XX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

; Put custom contexts here and reference them from the UI
; (modem "incoming context" or phone "context" override).
#exec /usr/local/bin/contexts.sh

#include aster.d/modems.conf
