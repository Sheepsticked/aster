# Aster — an example inventory: one appliance, reached over SSH as a user with sudo.
# Copy it, put your host in, and keep the secrets in a vault file beside it (group_vars/aster/vault.yml).
#
#   ansible-playbook -i inventory.ini install/ansible/playbook.yml --ask-vault-pass

[aster]
appliance ansible_host=192.168.1.10 ansible_user=pi

[aster:vars]
# aster_repo_dest=/srv/aster       ; the appliance's folder; its data goes into data/ inside it
# aster_http_port=80
# aster_image_source=build        ; build | pull (default pull)
# aster_version=dev               ; a release tag: v1.2.3
