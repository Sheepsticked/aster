; Aster — starter file (hand-owned, installed only if absent). Reload: module reload res_pjsip.so.
; The generated endpoints (aster.d/phones.conf) inherit the three templates: keep their names, above the include.
; There is no anonymous endpoint identifier: an unauthenticated INVITE is rejected.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[aster-phone](!)
type = endpoint
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
language = ru
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = yes

[aster-auth](!)
type = auth
auth_type = userpass

[aster-aor](!)
type = aor
max_contacts = 2
remove_existing = yes

#include aster.d/phones.conf
