; Aster — starter file (hand-owned, installed only if absent). Reload: DongleReload gracefully.
; Only [general] and [defaults] belong here: devices are generated (aster.d/dongle-devices.conf), and the lint refuses a
; device key (imei, data, audio) because chan_dongle crashes Asterisk on a file it cannot parse.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-dongle     ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
; Delete received SMS from the SIM: the controller has stored them, and a full SIM store silently stops reception.
autodeletesms = yes

#include aster.d/dongle-devices.conf
