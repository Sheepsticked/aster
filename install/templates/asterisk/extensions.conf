; Aster — starter file (hand-owned, installed only if absent). Reload: dialplan reload.
; Keep the two #include lines (generated globals and contexts); context names starting with aster- are reserved.
[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]
#include aster.d/globals.conf        ; GSM1=Quectel/gsm1 ... maintained by Aster
; Jitter buffer on a phone's audio in calls through a modem (adaptive, fixed, or empty for none): smooths Wi-Fi
; softphones at the cost of about 40 ms (adaptive) or 200 ms (fixed) of delay. Phone-to-phone calls never get one.
PHONE_JITTERBUFFER=adaptive

[internal]
; Phone-to-phone dialling (included by the generated [aster-phones-internal]): the patterns cover every number the
; registry accepts (3 to 6 digits).
exten => _XXX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()
exten => _XXXX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()
exten => _XXXXX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()
exten => _XXXXXX,1,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

; Put custom contexts here and reference them from the UI
; (modem "incoming context" or phone "context" override).

#include aster.d/modems.conf
