; Aster — starter file (hand-owned, installed only if absent). Reload: logger reload.
; Verbose lines are written once, to `full` (logs/asterisk; the controller rotates it at 20 MB, keeping five); the
; console that `docker logs` stores keeps notice and above, to save SD-card writes.
[general]
dateformat = %F %T

[logfiles]
console => notice,warning,error
full => notice,warning,error,verbose(3)
