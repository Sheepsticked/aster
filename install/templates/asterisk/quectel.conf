; Aster — starter file (hand-owned, installed only if absent). Reload: QuectelReload gracefully.
; Only [general] and [defaults] belong here: devices are generated (aster.d/quectel-devices.conf), and the lint refuses
; a device key (imei, data, audio, quec_uac, alsadev) because chan_quectel crashes Asterisk on a file it cannot parse.
[general]
interval = 15
smsdb = /var/lib/asterisk/smsdb-quectel    ; one sqlite file per driver: both drivers run in one process
csmsttl = 600

[defaults]
initstate = stop
; Delete received SMS from the SIM: the controller has stored them, and a full SIM store silently stops reception.
autodeletesms = yes
qrxgain = 8192                  ; EC25 downlink digital gain (AT+QRXGAIN, 0..65535), sent at every connect; the modem's
                                ; default 20577 clips a caller of normal loudness. Remove the line to send nothing.

#include aster.d/quectel-devices.conf
