; Aster — starter file (hand-owned, installed only if absent). Applying it restarts Asterisk.
; The image has only the modules Aster needs, so nothing is noloaded; a missing `require` module stops Asterisk.
[modules]
autoload = yes
require => chan_pjsip.so
require => chan_quectel.so
require => chan_dongle.so
require => res_musiconhold.so
require => pbx_config.so
require => app_dial.so
require => app_system.so
require => app_stack.so
require => func_base64.so
